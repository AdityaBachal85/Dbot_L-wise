<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>DBOT Land Intelligence</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="map-pane">
      <div class="search-box">
        <input id="search-input" type="text" placeholder="Search CTS / village" autocomplete="off" />
        <div id="search-results" class="search-results hidden"></div>
      </div>
      <div id="map"></div>
    </div>

    <div class="panel" id="details-panel">
      <div class="panel-header">
        <div>
          <h2 id="panel-title">Location &amp; Land Details</h2>
          <span id="panel-subtitle" class="muted">No plot selected</span>
        </div>
        <button id="panel-close" class="icon-btn" aria-label="Close">&times;</button>
      </div>

      <div class="panel-body">
        <section>
          <h3>Location Details</h3>
          <div class="field-list">
            <div class="field"><label>Project</label><span id="f-project">—</span></div>
            <div class="field"><label>City</label><span id="f-city">—</span></div>
            <div class="field"><label>Ward</label><span id="f-ward">—</span></div>
            <div class="field"><label>Village</label><span id="f-village">—</span></div>
            <div class="field"><label>Zone</label><span id="f-zone">—</span></div>
            <div class="field"><label>DP Zone</label><span id="f-dpzone">—</span></div>
            <div class="field"><label>CTS/TPS</label><span id="f-cts">—</span></div>
            <div class="field"><label># Plots</label><span id="f-plots">—</span></div>
          </div>
        </section>

        <section class="editable-section" id="land-details-section">
          <h3>Land Details</h3>
          <div class="field-list">
            <div class="field editable"><label>Area</label><span class="value" id="f-area">—</span><span class="unit">sq m</span><button class="edit-btn" data-field="area">&#9998;</button></div>
            <div class="field editable"><label>Avg Width</label><span class="value" id="f-avgwidth">—</span><span class="unit">m</span><button class="edit-btn" data-field="avgwidth">&#9998;</button></div>
            <div class="field editable"><label>Avg Elevation</label><span class="value" id="f-elevation">—</span><span class="unit">m</span><button class="edit-btn" data-field="elevation">&#9998;</button></div>
            <div class="field editable"><label>Excluded</label><span class="value" id="f-excluded">0</span><span class="unit">sq m</span><button class="edit-btn" data-field="excluded">&#9998;</button></div>
            <div class="field editable"><label>Abutting Road</label><span class="value" id="f-abutting">—</span><button class="edit-btn" data-field="abutting">Edit</button></div>
            <div class="field editable"><label>Ownership</label><span class="value" id="f-ownership">—</span><button class="edit-btn" data-field="ownership">Edit</button></div>
            <div class="field editable"><label>Development Type</label><span class="value" id="f-devtype">—</span><button class="edit-btn" data-field="devtype">Edit</button></div>
          </div>
        </section>

        <section id="additional-details-section" class="hidden">
          <h3>Additional Land Details</h3>
          <div class="field-list">
            <div class="field"><label>Ht. Permitted by AAI</label><span id="ad-aai">—</span><span class="unit">m</span></div>
            <div class="field"><label>Area under DP Road/Setback</label><span id="ad-road">—</span><span class="unit">sq m</span></div>
            <div class="field"><label>Area under Reservations</label><span id="ad-resarea">—</span><span class="unit">sq m</span></div>
            <div class="field"><label># of Reservations</label><span id="ad-rescount">—</span></div>
            <div class="field"><label>Falls in Gaothan/Koliwada/Adivasipada</label><span id="ad-gaothan">—</span></div>
          </div>

          <div class="field-list flagged-list">
            <div class="field flagged" data-tooltip-target="ad-crz-tip"><label>Falls in CRZ</label><span id="ad-crz">—</span><span class="confidence-flag" title="Lower confidence — hover for details">ⓘ</span></div>
            <p class="field-note" id="ad-crz-tip"></p>
            <div class="field flagged" data-tooltip-target="ad-metro-tip"><label>Within Metro Proximity</label><span id="ad-metro">—</span><span class="confidence-flag" title="Lower confidence — hover for details">ⓘ</span></div>
            <p class="field-note" id="ad-metro-tip"></p>
            <div class="field flagged" data-tooltip-target="ad-industrial-tip"><label>Falls in Industrial Zone</label><span id="ad-industrial">—</span><span class="confidence-flag" title="Lower confidence — hover for details">ⓘ</span></div>
            <p class="field-note" id="ad-industrial-tip"></p>
          </div>

          <div class="field-list gap-list">
            <div class="field gap"><label>ASR-based Rate</label><span id="ad-asr">Not yet available</span></div>
            <div class="field gap"><label>CBD Boundary</label><span id="ad-cbd">Not yet available</span></div>
            <div class="field gap"><label>Slums on Site</label><span id="ad-slums">Not yet available</span></div>
          </div>

          <details id="all-features-details">
            <summary>All intersecting layers (<span id="ad-feature-count">0</span>)</summary>
            <div id="ad-feature-list" class="feature-list"></div>
          </details>
        </section>

        <label class="acknowledge">
          <input type="checkbox" id="acknowledge-checkbox" />
          I acknowledge that I cannot edit Basic details after proceeding.
        </label>
        <button id="continue-btn" class="btn-primary" disabled>Continue</button>
      </div>
    </div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
