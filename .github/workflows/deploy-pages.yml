name: Deploy dbot-landwise to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dbot-landwise/public/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let an in-flight run finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # No LFS needed: dbot-landwise/public is plain committed static files
        # (precomputed JSON + geometry copies) — it never reads data/layers/*,
        # which is the only LFS-tracked path in this repo.

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dbot-landwise/public as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dbot-landwise/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
